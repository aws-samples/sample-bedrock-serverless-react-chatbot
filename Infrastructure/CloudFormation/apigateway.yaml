AWSTemplateFormatVersion: "2010-09-09"

Description: "API Gateway Stack for GovCloud - REST API for React application delivery"

Parameters:
  # Foundation Stack Outputs
  S3KMSKeyArn:
    Type: String
    Description: KMS key ARN for S3 encryption from Foundation stack (for IAM policies)
  CloudWatchLogsKMSKeyArn:
    Type: String
    Description: KMS key ARN for CloudWatch Logs encryption from Foundation stack
  
  # CICD Stack Outputs
  UICodeS3Bucket:
    Type: String
    Description: S3 bucket hosting React application from CICD stack
  
  # User-provided Parameters
  APIGatewayName:
    Type: String
    Description: Name for the API Gateway REST API
  APIGatewayLogGroupName:
    Type: String
    Description: Name for the CloudWatch Log Group (use existing or create new)
    Default: ""
  APIGatewayEndpointType:
    Type: String
    Description: Endpoint type for the API Gateway (PRIVATE or REGIONAL)
    Default: REGIONAL
  VpcId:
    Type: String
    Description: VPC ID for PRIVATE endpoint type (required for PRIVATE endpoints)
    Default: ""
  ExecuteApiVpceId:
    Type: String
    Description: VPC Endpoint ID for execute-api (required for PRIVATE endpoints to associate the VPCE)
    Default: ""

Conditions:
  IsPrivateEndpoint: !Equals [!Ref APIGatewayEndpointType, "PRIVATE"]
  HasExecuteApiVpce: !Not [!Equals [!Ref ExecuteApiVpceId, ""]]
  IsPrivateWithVpce: !And
    - !Condition IsPrivateEndpoint
    - !Condition HasExecuteApiVpce
  IsPrivateWithoutVpce: !And
    - !Condition IsPrivateEndpoint
    - !Not [!Condition HasExecuteApiVpce]

Resources:

  # CloudWatch Log Group for API Gateway access logs
  # Note: If log group already exists, CloudFormation will fail.
  APIGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}"
      RetentionInDays: 90
      KmsKeyId: !Ref CloudWatchLogsKMSKeyArn

  APIGatewayS3AccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-APIGatewayS3Access"
      Path: /
      PolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Sid: GetObjectInBucket
            Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${UICodeS3Bucket}/*
          - Sid: KMSDecryptAccess
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref S3KMSKeyArn
  IAMRole:
    Type: "AWS::IAM::Role"
    Properties:
      Path: "/"
      RoleName: !Sub "${AWS::StackName}-APIGatewayS3ProxyPolicy"
      AssumeRolePolicyDocument: "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"apigateway.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}"
      MaxSessionDuration: 3600
      ManagedPolicyArns: 
      - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
      - !Ref APIGatewayS3AccessPolicy

  ApiGatewayRestApi:
    Type: "AWS::ApiGateway::RestApi"
    Properties:
      Name: !Sub ${APIGatewayName}
      ApiKeySourceType: "HEADER"
      BinaryMediaTypes:
      - "*/*"
      EndpointConfiguration:
        Types:
        - !Ref APIGatewayEndpointType
        VpcEndpointIds: !If
          - IsPrivateWithVpce
          - - !Ref ExecuteApiVpceId
          - !Ref AWS::NoValue
      Policy: !If
        - IsPrivateWithVpce
        # Scenario 1: PRIVATE with VPCE - strict VPCE-only access
        - Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal: "*"
              Action: "execute-api:Invoke"
              Resource: "execute-api:/*"
              Condition:
                StringEquals:
                  aws:sourceVpce: !Ref ExecuteApiVpceId
        # Check if PRIVATE without VPCE
        - !If
            - IsPrivateWithoutVpce
            # Scenario 2: PRIVATE without VPCE - allow from VPC
            - Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal: "*"
                  Action: "execute-api:Invoke"
                  Resource: "execute-api:/*"
                  Condition:
                    StringEquals:
                      aws:sourceVpc: !Ref VpcId
            # Scenario 3: Not PRIVATE - no policy
            - !Ref AWS::NoValue

  ChatbotResource:
    Type: "AWS::ApiGateway::Resource"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      PathPart: "chatbot"
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId

  ApiGatewayResource2:
    Type: "AWS::ApiGateway::Resource"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      PathPart: "{item+}"
      ParentId: !Ref ChatbotResource

  ApiGatewayMethod:
    Type: "AWS::ApiGateway::Method"
    Metadata:
      # Accepted risk: this GET method is intentionally public (AuthorizationType: NONE).
      # It serves the static React app from S3 and acts as a CloudFront replacement in
      # GovCloud, where CloudFront is not available. The endpoint is fronted by the WAF
      # WebACL (AWS managed rules + rate limiting) and the integration IAM role is scoped
      # to read-only s3:GetObject on the single UI bucket, so CKV_AWS_59 is suppressed.
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: "Accepted risk: public content-delivery endpoint replacing CloudFront in GovCloud; fronted by WAF and scoped to read-only S3 GetObject."
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResource2
      HttpMethod: "GET"
      # AuthorizationType is intentionally set to NONE for use in GovCloud as a CloudFront alternative
      AuthorizationType: "NONE"
      ApiKeyRequired: false
      RequestParameters: 
        "method.request.path.item": true
      MethodResponses: 
      - 
        ResponseModels: 
          "application/json": !Ref ApiGatewayModel
        ResponseParameters: 
          "method.response.header.Access-Control-Allow-Origin": false
          "method.response.header.Content-Type": false
          "method.response.header.content-type": false
        StatusCode: "200"
      # Error responses must declare Content-Type as a method response header so the
      # integration responses below can override S3's application/xml with our own
      # sanitized body. Without these the raw S3 <Error> XML (which contains
      # <BucketName> and <Key>) is returned to the caller verbatim.
      - 
        ResponseParameters: 
          "method.response.header.Access-Control-Allow-Origin": false
          "method.response.header.Content-Type": false
        StatusCode: "404"
      - 
        ResponseParameters: 
          "method.response.header.Access-Control-Allow-Origin": false
          "method.response.header.Content-Type": false
        StatusCode: "500"
      Integration: 
        Credentials: !GetAtt IAMRole.Arn
        IntegrationHttpMethod: "GET"
        IntegrationResponses: 
        - 
          ResponseParameters: 
            "method.response.header.Access-Control-Allow-Origin": "'*'"
            "method.response.header.Content-Type": "integration.response.header.Content-Type"
            "method.response.header.content-type": "integration.response.header.content-type"
          StatusCode: "200"
        # S3 returns an XML <Error> document on failure that echoes the bucket name and
        # object key (NoSuchKey when the object is missing, AccessDenied when the object
        # is missing and the role has no s3:ListBucket - which is the case here). Both
        # collapse into this 4xx branch. ResponseTemplates replace the body with a static
        # page so nothing about the bucket or key reaches the caller.
        #
        # ContentHandling: CONVERT_TO_TEXT is required because BinaryMediaTypes on this
        # API is "*/*", which makes API Gateway treat every response as binary and skip
        # body mapping templates. Forcing text handling on the error branches only keeps
        # binary passthrough intact for real assets on the 200 branch.
        #
        # Templates are keyed by several content types because API Gateway selects a
        # response template by matching against the payload/Accept content type; a single
        # key would be bypassed for callers negotiating a different type.
        - 
          SelectionPattern: "4\\d{2}"
          StatusCode: "404"
          ContentHandling: "CONVERT_TO_TEXT"
          ResponseParameters: 
            "method.response.header.Access-Control-Allow-Origin": "'*'"
            "method.response.header.Content-Type": "'text/html'"
          ResponseTemplates: 
            "application/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
            "text/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
            "application/json": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
            "text/html": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
        - 
          SelectionPattern: "5\\d{2}"
          StatusCode: "500"
          ContentHandling: "CONVERT_TO_TEXT"
          ResponseParameters: 
            "method.response.header.Access-Control-Allow-Origin": "'*'"
            "method.response.header.Content-Type": "'text/html'"
          ResponseTemplates: 
            "application/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
            "text/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
            "application/json": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
            "text/html": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
        PassthroughBehavior: "WHEN_NO_MATCH"
        RequestParameters: 
          "integration.request.path.object": "method.request.path.item"
        TimeoutInMillis: 29000
        Type: "AWS"
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${UICodeS3Bucket}/{object}"

  ApiGatewayMethod2:
    Type: "AWS::ApiGateway::Method"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResource2
      HttpMethod: "OPTIONS"
      # AuthorizationType is intentionally set to NONE for use in GovCloud as a CloudFront alternative
      AuthorizationType: "NONE"
      ApiKeyRequired: false
      RequestParameters: 
        "method.request.path.item": true
      MethodResponses: 
      - 
        ResponseModels: 
          "application/json": !Ref ApiGatewayModel
        ResponseParameters: 
          "method.response.header.Access-Control-Allow-Headers": false
          "method.response.header.Access-Control-Allow-Methods": false
          "method.response.header.Access-Control-Allow-Origin": false
        StatusCode: "200"
      Integration:
        IntegrationResponses: 
        - 
          ResponseParameters: 
            "method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            "method.response.header.Access-Control-Allow-Methods": "'GET,OPTIONS'"
            "method.response.header.Access-Control-Allow-Origin": "'*'"
          StatusCode: "200"
        PassthroughBehavior: "WHEN_NO_MATCH"
        RequestTemplates: 
          "application/json": "{\"statusCode\": 200}"
        TimeoutInMillis: 29000
        Type: "MOCK"

  ApiGatewayModel:
    Type: "AWS::ApiGateway::Model"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Schema: |
          {
            "title" : "Empty Schema",
            "type" : "object"
          }
      ContentType: "application/json"

  ApiGatewayStage:
    Type: "AWS::ApiGateway::Stage"
    Metadata:
      # X-Ray tracing is an observability feature, not a security control, so it
      # provides no security benefit for this API. CKV_AWS_73 is suppressed.
      checkov:
        skip:
          - id: CKV_AWS_73
            comment: "X-Ray tracing is an observability feature with no security benefit for this API; intentionally not enabled."
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: "v1"    # You can change this to your desired stage name
      DeploymentId: !Ref ApiGatewayDeploymentV2
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
      AccessLogSetting:
        DestinationArn: !GetAtt APIGatewayLogGroup.Arn
        Format: '$context.requestId $context.extendedRequestId $context.identity.sourceIp $context.requestTime $context.routeKey $context.status'

  # Gateway Responses - sanitize errors raised by API Gateway itself, before the
  # integration is ever reached (unknown path, WAF block, throttling). The stock
  # DEFAULT_4XX body leaks internals such as "Missing Authentication Token", which
  # is what a request to /v1/chatbot (no object key) returns.
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Content-Type: "'text/html'"
      ResponseTemplates:
        application/json: '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Content-Type: "'text/html'"
      ResponseTemplates:
        application/json: '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'

  ###############################
  # Deployment logical ID is versioned on purpose.
  #
  # AWS::ApiGateway::Deployment captures a snapshot of the API model at create time.
  # Editing a method, integration response or gateway response above does NOT produce
  # a new snapshot, so CloudFormation reports UPDATE_COMPLETE while the live v1 stage
  # keeps serving the old model. Bumping Description does not help either - that is an
  # in-place update on the existing deployment.
  #
  # Any time the API model above changes, increment the V<n> suffix here and in the
  # Stage's DeploymentId.
  #
  # V2: sanitized 4xx/5xx integration responses and added gateway responses so S3
  #     error XML (bucket name + object key) is no longer returned to callers.
  ###############################
  ApiGatewayDeploymentV2:
    Type: "AWS::ApiGateway::Deployment"
    DependsOn:
      - ApiGatewayMethod
      - ApiGatewayMethod2
      - GatewayResponseDefault4XX
      - GatewayResponseDefault5XX
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: "Deployment for chatbot API"

  ApiGatewayWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${APIGatewayName}-WAF
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsRuleSetMetric
        - Name: RateLimitRule
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRuleMetric
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${APIGatewayName}-WAF

  ApiGatewayWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: ApiGatewayStage
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${ApiGatewayRestApi}/stages/v1"
      WebACLArn: !GetAtt ApiGatewayWebACL.Arn

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/v1/chatbot"
  UserURL:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/v1/chatbot/index.html"